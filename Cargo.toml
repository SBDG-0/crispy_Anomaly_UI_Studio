[workspace]
members = ["editors/icons", "editors/layout", "crates/core"]
resolver = "2"

[package]
name = "anomaly-studio"
version = "0.7.0"
edition = "2021"

[dependencies]
rfd = "0.15"
studio-core = { path = "crates/core" }
eframe = { version = "0.31.1", default-features = false, features = ["glow", "default_fonts"] }
image = { version = "0.25", default-features = false, features = ["ico"] }
studio-icons = { path = "editors/icons" }
studio-layout = { path = "editors/layout" }

[profile.release]
panic = "unwind"
opt-level = 2
